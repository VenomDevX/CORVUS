# Supply-chain checks (SECURITY.md item 10): naming guard plus dependency
# audits for both ecosystems, on every push/PR and weekly for fresh advisories.
#
# Gating policy: the build FAILS only on high/critical advisories in
# dependencies that actually ship (production deps). Dev/build-only tooling
# (Vite, vitest, esbuild, electron-builder, electron, the pip toolchain) never
# ships in the packaged app, so its advisories are reported for visibility but
# do not fail CI. See the SECURITY.md audit log for the rationale.
name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Naming guard
        run: node scripts/naming-guard.mjs

      # Gating: shipped (production) dependencies only.
      - name: npm audit — production deps (root)
        run: npm audit --omit=dev --audit-level=high

      - name: npm audit — production deps (frontend)
        run: npm audit --omit=dev --audit-level=high
        working-directory: frontend

      # Informational: full audit incl. dev/build tooling (never fails CI).
      - name: npm audit — full (informational)
        run: |
          npm audit || true
          npm audit --prefix frontend || true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Upgrade the build toolchain first: pip/setuptools advisories are about
      # the runner's own tools, not our dependencies, and clearing them keeps
      # the audit focused on what actually ships.
      - name: pip-audit (backend runtime deps)
        run: |
          python -m pip install --upgrade pip setuptools wheel pip-audit
          pip install ./backend
          pip-audit
