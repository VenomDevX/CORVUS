[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "corvus-backend"
version = "0.1.0"
description = "Corvus core service - LLM streaming, memory, and (in later milestones) voice and agent actions"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "structlog>=24.4",
    "numpy>=1.26",
    "sounddevice>=0.5",
    "miniaudio>=1.61",
    "faster-whisper>=1.0",
    "edge-tts>=6.1",
    "pyttsx3>=2.98",
    "playwright>=1.40",
    "rapidocr-onnxruntime>=1.3",
    "pyautogui>=0.9.54",
    "python-multipart>=0.0.9",
    "pypdf>=4.0",
    "onnxruntime-directml>=1.17; sys_platform == 'win32'",
    "piper-tts>=1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]
build = [
    "pyinstaller>=6.10",
]

[tool.hatch.build.targets.wheel]
packages = ["corvus"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
