<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Corvus app icon">
  <!-- App icon: mark on rounded-square deep-black tile with subtle accent glow. -->
  <defs>
    <radialGradient id="tile-glow" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0" stop-color="#16264A"/>
      <stop offset="0.55" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#05060A"/>
    </radialGradient>
    <linearGradient id="ai-crown" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7AAAFF"/>
      <stop offset="1" stop-color="#4F8CFF"/>
    </linearGradient>
    <linearGradient id="ai-beak" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0" stop-color="#4F8CFF"/>
      <stop offset="1" stop-color="#2E5FC7"/>
    </linearGradient>
    <linearGradient id="ai-back" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#2E5FC7"/>
      <stop offset="1" stop-color="#1B3A80"/>
    </linearGradient>
    <linearGradient id="ai-neck" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B3A80"/>
      <stop offset="1" stop-color="#122649"/>
    </linearGradient>
    <mask id="eye-cut-icon">
      <rect width="512" height="512" fill="white"/>
      <circle cx="285" cy="205" r="19" fill="black"/>
    </mask>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#tile-glow)"/>
  <circle cx="256" cy="240" r="150" fill="#4F8CFF" opacity="0.14"/>
  <g mask="url(#eye-cut-icon)">
    <polygon points="140,188 288,118 310,254 " fill="url(#ai-crown)"/>
    <polygon points="288,118 458,278 310,254" fill="url(#ai-beak)"/>
    <polygon points="140,188 310,254 248,388" fill="url(#ai-back)"/>
    <polygon points="310,254 458,278 248,388" fill="url(#ai-neck)"/>
  </g>
</svg>
