<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 320" role="img" aria-label="Corvus logo lockup">
  <!-- Horizontal lockup: mark + Corvus wordmark, for dark surfaces. -->
  <defs>
    <linearGradient id="lk-crown" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7AAAFF"/>
      <stop offset="1" stop-color="#4F8CFF"/>
    </linearGradient>
    <linearGradient id="lk-beak" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0" stop-color="#4F8CFF"/>
      <stop offset="1" stop-color="#2E5FC7"/>
    </linearGradient>
    <linearGradient id="lk-back" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#2E5FC7"/>
      <stop offset="1" stop-color="#1B3A80"/>
    </linearGradient>
    <linearGradient id="lk-neck" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B3A80"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <mask id="lk-eye">
      <rect width="1120" height="320" fill="white"/>
      <circle cx="173" cy="128" r="11" fill="black"/>
    </mask>
  </defs>
  <g mask="url(#lk-eye)" transform="translate(20,20) scale(0.55)">
    <polygon points="150,180 280,118 300,240" fill="url(#lk-crown)"/>
    <polygon points="280,118 430,260 300,240" fill="url(#lk-beak)"/>
    <polygon points="150,180 300,240 246,362" fill="url(#lk-back)"/>
    <polygon points="300,240 430,260 246,362" fill="url(#lk-neck)"/>
  </g>
  <text x="300" y="205" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="128" font-weight="600" letter-spacing="-2" fill="#F5F7FA">Corvus</text>
</svg>
